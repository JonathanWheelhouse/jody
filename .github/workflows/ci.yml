name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install apt deps (Debian)
        run: |
          apt-get update
          apt-get -y install --no-install-recommends \
            meson ninja-build clang-22 pkg-config build-essential ca-certificates \
            libsdl3-dev libsdl3-image-dev

      - name: Sanity check SDL pkg-config
        run: |
          echo "sdl3:" $(pkg-config --modversion sdl3 2>/dev/null || echo "not-found")
          echo "sdl3-image:" $(pkg-config --modversion sdl3-image 2>/dev/null || echo "not-found")

      - name: Configure (meson)
        run: CC=clang-22 meson setup build

      - name: Build
        run: meson compile -C build --verbose

      - name: Smoke test (print usage)
        run: ./build/src/jody --usage || true
