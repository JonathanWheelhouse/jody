name: "CodeQL"

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '0 21 * * 4'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    env:
      DEBIAN_FRONTEND: noninteractive

    strategy:
      fail-fast: false
      matrix:
        language: ['cpp']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Install build deps (Debian)
        run: |
          apt-get update
          apt-get -y install --no-install-recommends \
            ninja-build meson clang-22 pkg-config build-essential ca-certificates \
            libsdl3-dev libsdl3-image-dev

      - name: build
        run: |
          meson CC=clang-22 setup build
          meson compile -C build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
